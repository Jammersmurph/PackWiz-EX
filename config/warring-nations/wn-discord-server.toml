[debug]
	#Hard cap on how many recent crash logs one /debug crashlogs invocation may request at once (the count option is clamped to this), so a maintainer can't accidentally queue a huge batch of DMs.
	# Default: 10
	# Range: 1 ~ 50
	crashLogMaxCount = 10
	#Max size, in bytes, of a single crash-log file Discord will accept as a DM attachment (Discord's own default non-boosted-server limit is 8 MiB per file; this addon gzips an oversized log before falling back to splitting it into numbered parts). Default 8388608 (8 MiB).
	# Default: 8388608
	# Range: 65536 ~ 104857600
	crashLogMaxAttachmentBytes = 8388608

[metrics]
	#Send anonymous server/player-count usage statistics to bStats (bstats.org), the standard analytics service most Minecraft mods use. Only aggregate counts are sent (player count, server count, OS/Java version) -- never player names, UUIDs, Discord ids, guild ids, IPs, or server addresses. This is an additional, mod-specific off switch; bStats also writes its own global opt-out file (config/bStats/config.yml) that applies to every mod on the server, independent of this setting. Default true (on by default, matching bStats' own convention), but you may want to turn this off if your server has a strict no-telemetry policy.
	enabled = true

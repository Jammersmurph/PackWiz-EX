[storage]
	#Storage type: 'MySQL', 'SQLite', or 'null' (not configured yet)
	type = "null"
	#MySQL server address
	address = "localhost"
	#The name of the database to store data in
	database = "minecraft"
	#MySQL username
	username = "root"
	#MySQL password
	password = ""

["General Settings"]
	#Maximum number of player inventory backups to keep (oldest will be deleted)
	# Default: 20
	# Range: 1 ~ 100
	maxPlayerInventories = 20
	#Maximum number of chunk backups to keep per chunk
	# Default: 20
	# Range: 1 ~ 100
	maxChunkBackups = 20
	#Hours between automatic inventory saves
	# Default: 3
	# Range: 1 ~ 24
	inventorySaveHours = 3
	#Hours between automatic chunk saves
	# Default: 3
	# Range: 1 ~ 24
	chunkSaveHours = 3
	#Number of threads for processing events
	# Default: 4
	# Range: 1 ~ 16
	queueThreadCount = 4
	#Maximum size of log files in MB before creating a new version (v2, v3, etc.)
	# Default: 5
	# Range: 1 ~ 50
	maxLogFileSizeMB = 5
	#Number of days to retain logs before deletion
	# Default: 7
	# Range: 1 ~ 365
	logRetentionDays = 7
	#Number of days to retain chunk backups before deletion (0 = never delete)
	# Default: 7
	# Range: 0 ~ 365
	cleaningChunks = 7
	#Number of days to retain player inventory backups before deletion (0 = never delete)
	# Default: 7
	# Range: 0 ~ 365
	cleaningInventory = 7

["Logging Settings"]
	#Log block breaking events
	logBlockBreak = true
	#Log block placement events
	logBlockPlace = true
	#Log player interactions
	logInteractions = true
	#Log container openings with full inventory contents
	logContainers = true
	#Log chat messages
	logChat = true
	#Log commands
	logCommands = true
	#Log player sessions (login/logout)
	logSessions = true
	#Log dimension changes
	logDimensions = true
	#Log game mode changes
	logGameMode = true
	#Log entity deaths
	logEntityDeath = true
	#Log item pickups
	logItemPickups = true
	#Log entity kills by players
	logEntityKills = true
	#Log commands executed from console
	logConsoleCommands = true
	#Log server start events
	logServerStart = true
	#Log server stop events
	logServerStop = true

["Logging Filter"]
	#For privacy, ignore these commands executed by the player
	commandFilter = ["register", "r", "login", "l", "changepassword", "password", "pass", "email"]
	#Ignore saving these entity types to the entity backup (use namespaced IDs, e.g. minecraft:skeleton)
	entitiesFilter = ["minecraft:skeleton", "minecraft:zombie"]
	#Ignore saving these block/block-entity types to the block backup (use namespaced IDs, e.g. minecraft:chest)
	blocksFilter = ["lootr:lootr_chest", "minecraft:redstone_block"]
